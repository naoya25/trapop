<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TraPoP</title>
    <link rel="stylesheet" href="../shared/tokens.css" />
    <link rel="stylesheet" href="./main.css" />
  </head>
  <body>
    <div class="tabs" role="tablist">
      <button class="tab tab--active" id="tab-history" role="tab" aria-selected="true">
        履歴
      </button>
      <button class="tab" id="tab-settings" role="tab" aria-selected="false">設定</button>
    </div>

    <section class="panel" id="panel-history" role="tabpanel">
      <p class="panel__placeholder">翻訳履歴はまだありません。</p>
    </section>

    <section class="panel" id="panel-settings" role="tabpanel" hidden>
      <p class="panel__placeholder">設定項目は準備中です。</p>
    </section>

    <script type="module" src="./main.ts"></script>
  </body>
</html>

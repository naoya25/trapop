<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TraPoP</title>
    <link rel="stylesheet" href="../shared/tokens.css" />
    <link rel="stylesheet" href="./main.css" />
  </head>
  <body>
    <div class="tabs" role="tablist">
      <button class="tab tab--active" id="tab-history" role="tab" aria-selected="true">
        履歴
      </button>
      <button class="tab" id="tab-settings" role="tab" aria-selected="false">設定</button>
    </div>

    <section class="panel" id="panel-history" role="tabpanel">
      <div class="history-toolbar">
        <span class="history-toolbar__count" id="history-count"></span>
        <button class="btn btn--danger" id="clear-history-button">全削除</button>
      </div>
      <ul class="history-list" id="history-list"></ul>
      <p class="panel__placeholder" id="history-empty" hidden>翻訳履歴はまだありません。</p>
    </section>

    <section class="panel" id="panel-settings" role="tabpanel" hidden>
      <div class="settings-group">
        <span class="settings-label">ホットキー</span>
        <div class="settings-row">
          <span class="hotkey-display" id="hotkey-display"></span>
          <button class="btn" id="hotkey-change-button">変更</button>
        </div>
        <p class="settings-hint" id="hotkey-hint" hidden></p>
      </div>

      <div class="settings-group">
        <span class="settings-label">言語ペア</span>
        <div class="settings-row">
          <select class="settings-select" id="lang-a-select">
            <option value="日本語">日本語</option>
            <option value="英語">英語</option>
            <option value="中国語">中国語</option>
            <option value="韓国語">韓国語</option>
          </select>
          <span>⇔</span>
          <select class="settings-select" id="lang-b-select">
            <option value="日本語">日本語</option>
            <option value="英語">英語</option>
            <option value="中国語">中国語</option>
            <option value="韓国語">韓国語</option>
          </select>
        </div>
      </div>

      <div class="settings-group">
        <label class="settings-label" for="engine-select">翻訳エンジン</label>
        <select class="settings-select" id="engine-select">
          <option value="auto">auto(キーがあれば openai、無ければ gemini)</option>
          <option value="openai">openai</option>
          <option value="gemini">gemini</option>
          <option value="mock">mock</option>
        </select>
      </div>

      <div class="settings-group">
        <label class="settings-label" for="openai-api-key-input">OpenAI API キー</label>
        <div class="settings-row">
          <input
            class="settings-input"
            id="openai-api-key-input"
            type="password"
            placeholder="sk-..."
            autocomplete="off"
          />
          <button class="btn" id="openai-api-key-save-button">保存</button>
        </div>
        <p class="settings-hint" id="openai-api-key-status"></p>
      </div>

      <div class="settings-group">
        <label class="settings-label" for="gemini-api-key-input">Gemini API キー</label>
        <div class="settings-row">
          <input
            class="settings-input"
            id="gemini-api-key-input"
            type="password"
            placeholder="AIza..."
            autocomplete="off"
          />
          <button class="btn" id="gemini-api-key-save-button">保存</button>
        </div>
        <p class="settings-hint" id="gemini-api-key-status"></p>
      </div>

      <div class="settings-group">
        <label class="settings-label" for="model-input">モデル名(空なら既定値)</label>
        <div class="settings-row">
          <input class="settings-input" id="model-input" type="text" placeholder="gpt-4.1-mini" />
          <button class="btn" id="model-save-button">保存</button>
        </div>
      </div>
    </section>

    <script type="module" src="./main.ts"></script>
  </body>
</html>

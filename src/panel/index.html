<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TraPoP</title>
    <link rel="stylesheet" href="../shared/tokens.css" />
    <link rel="stylesheet" href="./panel.css" />
  </head>
  <body>
    <main class="view">
      <div class="view__meta" id="view-meta"></div>

      <div class="paste-form" id="paste-form">
        <div
          class="paste-form__input"
          id="paste-input"
          contenteditable="true"
          data-placeholder="ここに貼り付け(⌘V)、または入力して ⌘Enter"
        ></div>
        <div class="paste-form__actions">
          <span class="paste-form__hint">⌘Enter で翻訳・Esc で閉じる</span>
          <button class="btn btn--primary" id="translate-button">翻訳</button>
        </div>
      </div>

      <div class="state state--error" id="state-error" hidden>
        <p id="error-message"></p>
        <div class="state__actions">
          <button class="btn btn--primary" id="retry-button">再試行</button>
        </div>
      </div>

      <div class="translation" id="translation" hidden>
        <pre class="translation__text" id="source-text" hidden></pre>
        <pre class="translation__text" id="translated-text"></pre>
        <div class="translation__html" id="translated-html" hidden></div>
      </div>

      <footer class="status-bar">
        <span class="status-bar__source" id="status-source"></span>
        <span class="status-bar__state" id="status-state"></span>
        <span class="status-bar__spacer"></span>
        <button class="btn" id="toggle-source" disabled>原文を表示</button>
        <button class="btn" id="copy-translation" disabled>訳をコピー</button>
      </footer>
    </main>

    <script type="module" src="./panel.ts"></script>
  </body>
</html>

<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TraPoP</title>
    <link rel="stylesheet" href="../shared/tokens.css" />
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <header class="header" data-tauri-drag-region>
      <span class="header__app-name" data-tauri-drag-region>TraPoP</span>
      <span class="header__mode" data-tauri-drag-region></span>
    </header>

    <main class="body">
      <div class="state state--loading" id="state-loading">
        <span class="spinner"></span>
        <span>選択テキストを取得中...</span>
      </div>

      <div class="state state--empty" id="state-empty" hidden>
        <p>選択テキストが取得できなかったため、クリップボードの内容を使用しました。</p>
      </div>

      <div class="state state--error" id="state-error" hidden>
        <p id="error-message"></p>
        <button class="btn btn--primary" id="retry-button">再試行</button>
      </div>

      <div class="translation" id="translation" hidden>
        <pre class="translation__text" id="source-text" hidden></pre>
        <pre class="translation__text" id="translated-text"></pre>
      </div>
    </main>

    <footer class="status-bar">
      <span class="status-bar__state" id="status-state">▍生成中</span>
      <span class="status-bar__spacer"></span>
      <button class="btn" id="toggle-source" disabled>原文を表示</button>
      <button class="btn" id="copy-translation" disabled>訳をコピー</button>
    </footer>

    <script type="module" src="./popup.ts"></script>
  </body>
</html>
